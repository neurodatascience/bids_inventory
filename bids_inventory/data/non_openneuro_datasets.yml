---
# Datasets that are not on OpenNeuro tracked by the inventory, by collection.
#
# `bids_inventory update --source non-openneuro` installs the datasets missing
# from the folder set by 'local_paths.non_openneuro' in the configuration
# (in <collection>/<dataset>), then indexes them in non_openneuro.jsonl.
#
# <collection>:
#     # added to the names of its datasets in the listing: ABIDE_Caltech
#     prefix: ABIDE_
#     # either a datalad dataset whose subdatasets are the datasets of the collection
#     superdataset: <source>
#     # optional: only these subdatasets
#     include: [<subdataset>, ...]
#     # or the datasets of the collection, one by one
#     datasets:
#         <dataset>: <source>
#
# Sources: URLs of datalad datasets, or ///<path> for https://datasets.datalad.org/<path>.
# New datasets can be found with tools/query_datalad_registry.py.
abide:
    prefix: ABIDE_
    superdataset: ///abide/RawDataBIDS
abide2:
    prefix: ABIDE2_
    superdataset: ///abide2/RawData
adhd200:
    prefix: ADHD200_
    superdataset: ///adhd200/RawDataBIDS
corr:
    prefix: CORR_
    superdataset: ///corr/RawDataBIDS
cneuromod:
    prefix: CNEUROMOD_
    superdataset: https://github.com/courtois-neuromod/cneuromod.git
    include: [anat, friends, harrypotter, hcptrt, movie10, shinobi, shinobi_training]
indi:
    prefix: INDI_
    datasets:
        HypnosisBarrios: ///indi/HypnosisBarrios/RawData
        PRIME_mountsinai-P: ///indi/PRIME/mountsinai-P
        PRIME_mountsinai-S: ///indi/PRIME/mountsinai-S
        PRIME_newcastle: ///indi/PRIME/newcastle
        PRIME_nki: ///indi/PRIME/nki
        PRIME_princeton: ///indi/PRIME/princeton
        PRIME_rockefeller: ///indi/PRIME/rockefeller
        PRIME_ucdavis: ///indi/PRIME/ucdavis
        PRIME_uminn: ///indi/PRIME/uminn
labs:
    prefix: LABS_
    datasets:
        gobbini_famface: ///labs/gobbini/famface/data
        haxby_life: ///labs/haxby/life
        haxby_raiders: ///labs/haxby/raiders
studyforrest:
    prefix: STUDYFORREST_
    datasets:
        3T_multiresolution_fmri: ///studyforrest/original/3T_multiresolution_fmri
        7T_multiresolution_fmri: ///studyforrest/original/7T_multiresolution_fmri
        phase2: ///studyforrest/original/phase2
# raw datasets of the dandisets (https://dandiarchive.org/)
