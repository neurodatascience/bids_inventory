        '000874': https://github.com/dandisets/000874.git
        '001344': https://github.com/dandisets/001344.git
        '001345': https://github.com/dandisets/001345.git
        '001346': https://github.com/dandisets/001346.git
        '001350': https://github.com/dandisets/001350.git
        '001353': https://github.com/dandisets/001353.git
        '001436': https://github.com/dandisets/001436.git
        '001440': https://github.com/dandisets/001440.git
        '001442': https://github.com/dandisets/001442.git
        '001449': https://github.com/dandisets/001449.git
        '001470': https://github.com/dandisets/001470.git
