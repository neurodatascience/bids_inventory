---
# Deploys the dashboard (bids_inventory/browse_app.py) on GitHub Pages,
# where it runs in the browser (WebAssembly).
# On pull requests, only checks that it builds.
name: deploy dashboard

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
    pull_request:
        branches: ['*']
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        -   uses: actions/checkout@v7
            with:
                # to get the version of the package from the git tags
                fetch-depth: 0

        -   name: Set up Python
            uses: actions/setup-python@v7
            with:
                python-version: '3.12'

        -   name: Install
            run: |
                python -m pip install --upgrade pip
                pip install build marimo uv

        -   name: Build the dashboard
            run: tools/build_dashboard.sh _site

        -   name: Upload the dashboard
            if: github.event_name != 'pull_request'
            uses: actions/upload-pages-artifact@v4
            with:
                path: _site

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
        -   name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v4
