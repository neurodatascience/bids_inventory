[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{ name = "Rémi Gau" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
dependencies = ["numpy", "pandas", "rich", "rich_argparse"]
description = "Keeps an inventory of publicly available BIDS datasets."
dynamic = ["version"]
license = { text = "MIT" }
maintainers = [{ name = "Rémi Gau", email = "remi.gau@gmail.com" }]
name = "bids-inventory"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
# marimo app to browse the listing: `bids_inventory browse`
browse = ["marimo", "plotly"]
dev = ["bids-inventory[browse,institutions,test,update]", "pandas-stubs", "pre-commit"]
# location of the institutions: `bids_inventory institutions`
institutions = ["geopy", "rapidfuzz", "unidecode"]
test = ["pytest", "pytest-cov"]
# update of the listing: `bids_inventory update`
update = ["datalad", "datalad-fuse", "mne", "nibabel", "pydantic>=2", "pyyaml", "requests"]

[project.scripts]
bids_inventory = "bids_inventory._cli:cli"

[project.urls]
"Bug tracker" = "https://github.com/neurodatascience/bids_inventory/issues"
Homepage = "https://github.com/neurodatascience/bids_inventory"

[tool.codespell]
skip = "./.git,env,venv,.venv,outputs,htmlcov,./tests/data/tmp,*openneuro.jsonl,*institutions.json,*institution_matches.tsv"

[tool.hatch.build.hooks.vcs]
version-file = "bids_inventory/_version.py"

[tool.hatch.build.targets.wheel]
exclude = ["bids_inventory/data/tmp"]
packages = ["bids_inventory"]

[tool.hatch.version]
source = "vcs"

[tool.pyrefly]
ignore-missing-imports = [
    "bids_inventory._version",
    "datalad.*",
    "geopy.*",
    "marimo",
    "matplotlib",
    "mne.*",
    "plotly.*",
    "rapidfuzz.*",
    "rich.*",
    "rich_argparse",
    "unidecode"
]
project-excludes = ["bids_inventory/_version.py"]
project-includes = ["bids_inventory"]
search-path = ["."]

[tool.pytest.ini_options]
addopts = "-ra -q -vv --showlocals --strict-markers --strict-config --cov bids_inventory --cov-report=html"
minversion = "6.0.0"
norecursedirs = "data"
testpaths = ["tests/"]
xfail_strict = true

[tool.ruff]
extend-exclude = ["bids_inventory/_version.py", "tests/data"]
line-length = 100
src = ["."]
target-version = "py311"

[tool.ruff.lint]
ignore = ["D101", "D103", "E501"]
mccabe = { max-complexity = 12 }
# E, W: pycodestyle / F: pyflakes / C90: mccabe / D: pydocstyle
# I: isort / UP: pyupgrade / FLY: flynt
select = ["C90", "D", "E", "F", "FLY", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D100", "D104"]
"__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
